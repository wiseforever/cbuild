[build]
build_type = Release
source_dir = .
generator = Ninja
parallel_jobs = auto

[compiler]
c_compiler = gcc
cpp_compiler = g++
conan_enable = 1
conan_build = gcc # conan_host 不指定则默认使用当前系统环境
conan_host = 

[msvc]
enable = 1
msvc_env_script = D:/Develop/Visual Studio/2019/BuildTools/VC/Auxiliary/Build/vcvarsall.bat
host_arch = x64
conan_enable = 1
conan_build = default
conan_host = 

