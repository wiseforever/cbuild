[build]
build_type = Debug
source_dir = .
generator = Ninja
parallel_jobs = 12

[conan]
conan_host = gcc
conan_build = gcc

[compiler]
c_compiler = gcc
cpp_compiler = g++

[msvc]
enable = 1
msvc_env_script = D:/Develop/VisualStudio/2019/Community/VC/Auxiliary/Build/vcvarsall.bat
host_arch = x64
conan_host = default_debug
conan_build = default_debug

