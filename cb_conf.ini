[build]
build_type = Release
source_dir = .
generator = Ninja
parallel_jobs = auto

[compiler]
c_compiler = gcc
cpp_compiler = g++

[conan]
enable = 1
build = gcc
host = gcc

[msvc]
enable = 1
msvc_env_script = D:/Develop/Visual Studio/2019/Community/VC/Auxiliary/Build/vcvarsall.bat
host_arch = x64

