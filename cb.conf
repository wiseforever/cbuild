[build]
build_type = Release
# source_dir = .          # project source dir, leave empty for "."
# output_dir = output     # build output dir, leave empty for "build"
# output_dir_use_subdir = true # 默认 true：追加构建类型子目录，例如 build/Release；false: 直接使用 output_dir
# subdir_use_compiler = false  # 默认 false；true: 子目录包含编译器，例如 build/GCC-9.4.0-Release；仅 output_dir_use_subdir = true 时生效
# 关闭子目录后，多种编译器/构建类型会共用 output_dir；切换编译器前需清理缓存或使用独立输出目录。
generator = Ninja
parallel_jobs = auto

[compiler]
compiler = gcc       # 自动配对 gcc/g++；也支持 gcc、clang、clang-14、交叉前缀及路径

[conan]
enable = 1
# build = gcc               # 未配置时按编译器匹配已有 gcc* profile，显式配置优先
# host = gcc                # 未配置时按编译器匹配已有 gcc* profile，显式配置优先

[vcpkg]
# enable = 1
# root = /path/to/vcpkg                  # 默认也可使用环境变量 VCPKG_ROOT
# toolchain_file = /path/to/vcpkg.cmake  # 非空时优先于 root
# triplet = x64-linux                    # 留空时由 vcpkg 根据当前编译器自动推断

[toolchain]
# custom_file = cbuild_custom.cmake

[msvc]
enable = 1
msvc_env_script = D:/devenv/Visual Studio/2019/Community/VC/Auxiliary/Build/vcvarsall.bat
host_arch = x64
