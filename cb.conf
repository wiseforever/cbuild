[build]
## 编译类型：Debug 或 Release
build_type = Release

## 源码目录，"."表示当前目录
# source_dir = .

## 构建输出目录，留空表示 build
# output_dir = output

## 默认 true：追加构建类型子目录，例如 build/Release；false: 直接使用 output_dir
# output_dir_use_subdir = true

## 默认 false；true: 子目录包含编译器，例如 build/GCC-9.4.0-Release；仅 output_dir_use_subdir = true 时生效
# subdir_use_compiler = false

## 关闭子目录后，多种编译器/构建类型会共用 output_dir；切换编译器前需清理缓存或使用独立输出目录。

## 构建工具：Ninja 或 Unix Makefiles 等
generator = Ninja

## 并行编译任务数，auto 表示按 CPU 核心数
parallel_jobs = auto

[compiler]
## 单一编译器驱动，自动配对 C/C++；支持 gcc、gcc-9、clang、clang-14、交叉前缀及驱动路径
compiler = gcc

[conan]
## 是否启用 Conan
enable = 1

## build profile；未配置时使用与 compiler 同名的 profile（如 gcc、clang-14、交叉前缀名）
## 显式配置的 build/host 同样校验存在性与 compiler 主版本
# build = gcc

## host profile；未配置时使用与 compiler 同名的 profile（如 gcc、clang-14、交叉前缀名）
# host = gcc

[vcpkg]
## 是否启用 vcpkg toolchain
# enable = 1

## vcpkg 根目录；默认也可使用环境变量 VCPKG_ROOT
# root = /path/to/vcpkg

## 非空时优先于 root
# toolchain_file = /path/to/vcpkg.cmake

## 留空时由 vcpkg 根据当前编译器自动推断
# triplet = x64-linux

[toolchain]
## 用户维护的 CMake 工具链扩展文件
# custom_file = cbuild_custom.cmake

[msvc]
## 是否启用 MSVC 编译环境（Windows）
enable = 1

## vcvarsall.bat 路径
msvc_env_script = D:/devenv/Visual Studio/2019/Community/VC/Auxiliary/Build/vcvarsall.bat

## 目标架构：x86 或 x64
host_arch = x64
